name: Release

# Triggered by a version tag (scripts/release.sh). Builds the console image for
# amd64 + arm64, publishes it to GHCR, creates the GitHub release, and updates
# the Homebrew tap. The tarball itself is GitHub's automatic source archive,
# which is what both install.sh and the formula download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version must match the tag
        run: |
          v="$(cat VERSION | tr -d '[:space:]')"
          [[ "v$v" == "${GITHUB_REF_NAME}" ]] || { echo "VERSION=$v but tag=${GITHUB_REF_NAME}"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mostly-works-studio/infrapack:${{ github.ref_name }}
            ghcr.io/mostly-works-studio/infrapack:latest
          # the CLI pulls <repo>:<VERSION> (no leading v)
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: also tag without the leading v
        run: |
          v="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "ghcr.io/mostly-works-studio/infrapack:$v" "ghcr.io/mostly-works-studio/infrapack:${GITHUB_REF_NAME}"

  release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Install or update:
            ```
            curl -fsSL https://raw.githubusercontent.com/Mostly-Works-Studio/infrapack/master/install.sh | bash
            brew install mostly-works-studio/tap/infrapack     # or: brew upgrade infrapack
            ```

  homebrew:
    # Needs a TAP_GITHUB_TOKEN secret: a fine-grained token with contents:write
    # on Mostly-Works-Studio/homebrew-tap.
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: render the formula
        run: |
          v="${GITHUB_REF_NAME#v}"
          scripts/release.sh formula "$v" > /tmp/infrapack.rb
          cat /tmp/infrapack.rb
      - name: push to the tap
        env:
          TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          [[ -n "$TOKEN" ]] || { echo "TAP_GITHUB_TOKEN not set — skipping tap update"; exit 0; }
          git clone -q "https://x-access-token:${TOKEN}@github.com/Mostly-Works-Studio/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/infrapack.rb /tmp/tap/Formula/infrapack.rb
          cd /tmp/tap
          git config user.name "infrapack-release"
          git config user.email "release@users.noreply.github.com"
          git add Formula/infrapack.rb
          git commit -q -m "infrapack ${GITHUB_REF_NAME}" || { echo "formula unchanged"; exit 0; }
          git push -q
