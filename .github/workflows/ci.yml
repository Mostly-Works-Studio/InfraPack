name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1"        # weekly: catches image tags that moved or vanished

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n bin/infrapack install.sh scripts/*.sh catalog/*/commands.sh catalog/*/hooks/*.sh
      - name: python syntax
        run: python3 -m py_compile console/*.py
      - name: catalog sanity (valid JSON, unique default ports)
        run: |
          python3 - <<'PY'
          import json, pathlib, re, collections
          ports = collections.defaultdict(list)
          for d in sorted(pathlib.Path('catalog').iterdir()):
              m = json.loads((d/'stack.json').read_text())
              assert m.get('stack') == d.name, d
              for line in (d/'defaults.env').read_text().splitlines():
                  mm = re.match(r'^([A-Z0-9_]+PORT\d*)=(\d+)$', line)
                  if mm: ports[mm.group(2)].append(f"{d.name}:{mm.group(1)}")
          ports['7070'].append('console')
          dupes = {p: v for p, v in ports.items() if len(v) > 1}
          assert not dupes, f"port clashes: {dupes}"
          print("ok:", len(list(pathlib.Path('catalog').iterdir())), "entries")
          PY
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./bin
          severity: error

  smoke:
    # the CLI end to end on a real Docker: console up, install, settings, custom tech, export/import
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: build console image
        run: docker build -q -t "ghcr.io/mostly-works-studio/infrapack:$(cat VERSION)" -f console/Dockerfile .
      - name: smoke
        env:
          INFRAPACK_DEV: "1"
        run: |
          set -euxo pipefail
          export PATH="$PWD/bin:$PATH"
          infrapack doctor
          infrapack up
          infrapack install redis REDIS_PORT=6380
          infrapack config set REDIS_UI_PORT=5541
          infrapack add mq --image nats:2-alpine --port 14222:4222 --healthcheck "wget -qO- http://127.0.0.1:8222/healthz"
          infrapack status
          infrapack export /tmp/team.json
          infrapack uninstall redis --purge
          infrapack uninstall mq --purge
          infrapack import /tmp/team.json --no-start
          infrapack status | grep -E '^(redis|mq) '
          mkdir -p /tmp/proj && printf 'techs:\n  - redis\n' > /tmp/proj/infrapack.yaml
          (cd /tmp/proj && infrapack up -y && infrapack down)
          curl -fsS localhost:7070/api/state | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["stacks"], d'
          infrapack down all

  catalog:
    # every catalog entry boots to healthy. Slow (~25 min), so only on main and weekly.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
      - name: build console image
        run: docker build -q -t "ghcr.io/mostly-works-studio/infrapack:$(cat VERSION)" -f console/Dockerfile .
      - name: boot every entry
        env:
          INFRAPACK_DEV: "1"
          TIMEOUT: "300"
        run: |
          export PATH="$PWD/bin:$PATH"
          infrapack up
          scripts/test-catalog.sh
