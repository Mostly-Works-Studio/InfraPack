name: CI

# One pipeline. Every push to master runs lint → smoke → full catalog boot.
# If all of that is green and VERSION names a version that has no tag yet,
# the same run tags it, builds the console image, publishes the GitHub
# release and updates the Homebrew tap. Releasing is therefore:
#
#   scripts/release.sh 0.2.0   # bumps VERSION and commits
#   git push
#
# Pull requests run lint + smoke only. The weekly run re-boots the catalog to
# catch upstream image tags that moved.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bash syntax
        run: bash -n bin/infrapack install.sh scripts/*.sh catalog/*/commands.sh catalog/*/hooks/*.sh
      - name: python syntax
        run: python3 -m py_compile console/*.py
      - name: catalog sanity (valid JSON, unique default ports)
        run: |
          python3 - <<'PY'
          import json, pathlib, re, collections
          ports = collections.defaultdict(list)
          for d in sorted(pathlib.Path('catalog').iterdir()):
              m = json.loads((d/'stack.json').read_text())
              assert m.get('stack') == d.name, d
              for line in (d/'defaults.env').read_text().splitlines():
                  mm = re.match(r'^([A-Z0-9_]+PORT\d*)=(\d+)$', line)
                  if mm: ports[mm.group(2)].append(f"{d.name}:{mm.group(1)}")
          ports['7070'].append('console')
          dupes = {p: v for p, v in ports.items() if len(v) > 1}
          assert not dupes, f"port clashes: {dupes}"
          print("ok:", len(list(pathlib.Path('catalog').iterdir())), "entries")
          PY
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./bin
          severity: error
      - name: is this push a release?
        id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION '$v' is not x.y.z"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]] \
             && ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "→ v$v is unreleased: this run will release it if green"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "→ v$v already released (or not a master push): CI only"
          fi

  smoke:
    # the CLI end to end on a real Docker: console up, install, settings, custom tech, export/import
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: build console image
        run: docker build -q -t "ghcr.io/mostly-works-studio/infrapack:$(cat VERSION)" -f console/Dockerfile .
      - name: smoke
        env:
          INFRAPACK_DEV: "1"
        run: |
          set -euxo pipefail
          export PATH="$PWD/bin:$PATH"
          infrapack doctor
          infrapack up
          infrapack install redis REDIS_PORT=6380
          infrapack config set REDIS_UI_PORT=5541
          infrapack add mq --image nats:2-alpine --port 14222:4222 --healthcheck "wget -qO- http://127.0.0.1:8222/healthz"
          infrapack status
          infrapack export /tmp/team.json
          infrapack uninstall redis --purge
          infrapack uninstall mq --purge
          infrapack import /tmp/team.json --no-start
          infrapack status | grep -E '^(redis|mq) '
          mkdir -p /tmp/proj && printf 'techs:\n  - redis\n' > /tmp/proj/infrapack.yaml
          (cd /tmp/proj && infrapack up -y && infrapack down)
          curl -fsS localhost:7070/api/state | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["stacks"], d'
          infrapack down all

  catalog:
    # every catalog entry boots to healthy. Slow (~25 min): master pushes and weekly only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
      - name: build console image
        run: docker build -q -t "ghcr.io/mostly-works-studio/infrapack:$(cat VERSION)" -f console/Dockerfile .
      - name: boot every entry
        env:
          INFRAPACK_DEV: "1"
          TIMEOUT: "600"
          PRUNE: "1"
        run: |
          export PATH="$PWD/bin:$PATH"
          infrapack up
          scripts/test-catalog.sh

  # ------------------------------------------------------------ release --
  release:
    if: needs.lint.outputs.release == 'true'
    needs: [lint, smoke, catalog]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.lint.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: tag v${{ env.VERSION }}
        run: |
          git config user.name "infrapack-release"
          git config user.email "release@users.noreply.github.com"
          git tag -a "v$VERSION" -m "InfraPack v$VERSION"
          git push origin "v$VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: console image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mostly-works-studio/infrapack:${{ env.VERSION }}
            ghcr.io/mostly-works-studio/infrapack:v${{ env.VERSION }}
            ghcr.io/mostly-works-studio/infrapack:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            Install or update:
            ```
            curl -fsSL https://raw.githubusercontent.com/Mostly-Works-Studio/infrapack/master/install.sh | bash
            brew tap mostly-works-studio/tap && brew trust mostly-works-studio/tap && brew install infrapack
            ```
      - name: Homebrew tap
        env:
          TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          [[ -n "$TOKEN" ]] || { echo "TAP_GITHUB_TOKEN not set — skipping tap update"; exit 0; }
          scripts/release.sh formula "$VERSION" > /tmp/infrapack.rb
          git clone -q "https://x-access-token:${TOKEN}@github.com/Mostly-Works-Studio/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp /tmp/infrapack.rb /tmp/tap/Formula/infrapack.rb
          cd /tmp/tap
          git config user.name "infrapack-release"
          git config user.email "release@users.noreply.github.com"
          git add Formula/infrapack.rb
          git commit -q -m "infrapack v$VERSION" || { echo "formula unchanged"; exit 0; }
          git push -q
