# Azurite — Azure Storage emulator (Blob, Queue, Table). Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:${AZURITE_VERSION:-latest}
    container_name: infrapack-azurite
    restart: *restart
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0",
              "--location", "/data", "--loose", "--skipApiVersionCheck", "--silent"]
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
      - "${AZURITE_TABLE_PORT:-10002}:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [infra]

volumes:
  azurite-data:
