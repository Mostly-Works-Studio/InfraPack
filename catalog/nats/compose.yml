# NATS with JetStream. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  nats:
    image: nats:${NATS_VERSION:-2-alpine}
    container_name: infrapack-nats
    restart: *restart
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [infra]

volumes:
  nats-data:
