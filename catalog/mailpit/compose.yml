# Mailpit — catches every email your app sends, with a web inbox. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-latest}
    container_name: infrapack-mailpit
    restart: *restart
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_DATABASE: /data/mailpit.db
    ports:
      - "${MAILPIT_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [infra]

volumes:
  mailpit-data:
