# PostgreSQL with the pgvector extension + pgweb. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  pgvector:
    image: pgvector/pgvector:${PGVECTOR_VERSION:-pg16}
    container_name: infrapack-pgvector
    restart: *restart
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-dev}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-dev}
      POSTGRES_DB: ${PGVECTOR_DATABASE:-vectors}
      TZ: ${TZ:-UTC}
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ${INFRAPACK_HOME}/stacks/pgvector/files/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-dev} -d ${PGVECTOR_DATABASE:-vectors}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [infra]

  pgvector-ui:
    image: sosedoff/pgweb:${PGVECTOR_UI_VERSION:-latest}
    container_name: infrapack-pgvector-ui
    restart: *restart
    environment:
      PGWEB_DATABASE_URL: postgres://${PGVECTOR_USER:-dev}:${PGVECTOR_PASSWORD:-dev}@pgvector:5432/${PGVECTOR_DATABASE:-vectors}?sslmode=disable
    ports:
      - "${PGVECTOR_UI_PORT:-8086}:8081"
    depends_on:
      pgvector:
        condition: service_healthy
    networks: [infra]

volumes:
  pgvector-data:
