# Temporal (workflow engine) with its own PostgreSQL and the Temporal UI. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-latest}
    container_name: infrapack-temporal
    restart: *restart
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [infra]

  temporal-db:
    image: postgres:16-alpine
    container_name: infrapack-temporal-db
    restart: *restart
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [infra]

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-latest}
    container_name: infrapack-temporal-ui
    restart: *restart
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      - temporal
    networks: [infra]

volumes:
  temporal-db-data:
