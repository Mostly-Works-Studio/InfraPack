# Neo4j graph database with the built-in Browser UI. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  neo4j:
    image: neo4j:${NEO4J_VERSION:-5}
    container_name: infrapack-neo4j
    restart: *restart
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-infrapack}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
    ports:
      - "${NEO4J_PORT:-7687}:7687"
      - "${NEO4J_UI_PORT:-7474}:7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [infra]

volumes:
  neo4j-data:
