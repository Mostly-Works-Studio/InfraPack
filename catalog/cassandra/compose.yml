# Apache Cassandra, single node. Managed by InfraPack. Slow to start (~1 min).
x-restart: &restart ${INFRA_RESTART:-no}

services:
  cassandra:
    image: cassandra:${CASSANDRA_VERSION:-5}
    container_name: infrapack-cassandra
    restart: *restart
    environment:
      CASSANDRA_CLUSTER_NAME: infrapack
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: ${CASSANDRA_HEAP:-1G}
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [infra]

volumes:
  cassandra-data:
