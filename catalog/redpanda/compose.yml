# Redpanda (Kafka-compatible, no JVM) + Redpanda Console. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  redpanda:
    image: redpandadata/redpanda:${REDPANDA_VERSION:-latest}
    container_name: infrapack-redpanda
    restart: *restart
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_PORT:-19092}
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${REDPANDA_PORT:-19092}:19092"
      - "${REDPANDA_SCHEMA_PORT:-18081}:18081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [infra]

  redpanda-ui:
    image: redpandadata/console:${REDPANDA_UI_VERSION:-latest}
    container_name: infrapack-redpanda-ui
    restart: *restart
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "${REDPANDA_UI_PORT:-8088}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [infra]

volumes:
  redpanda-data:
