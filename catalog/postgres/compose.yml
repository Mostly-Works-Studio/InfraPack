# PostgreSQL + pgweb (zero-login SQL browser). Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: infrapack-postgres
    restart: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DATABASE:-local}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DATABASE:-local}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [infra]

  postgres-ui:
    image: sosedoff/pgweb:${POSTGRES_UI_VERSION:-latest}
    container_name: infrapack-postgres-ui
    restart: *restart
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DATABASE:-local}?sslmode=disable
    ports:
      - "${POSTGRES_UI_PORT:-8082}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [infra]

volumes:
  postgres-data:
