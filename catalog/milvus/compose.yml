# Milvus standalone (embedded etcd, local storage) + Attu UI. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  milvus:
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.5.10}
    container_name: infrapack-milvus
    restart: *restart
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
      - ${INFRAPACK_HOME}/stacks/milvus/files/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ${INFRAPACK_HOME}/stacks/milvus/files/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [infra]

  milvus-ui:
    image: zilliz/attu:${MILVUS_UI_VERSION:-latest}
    container_name: infrapack-milvus-ui
    restart: *restart
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${MILVUS_UI_PORT:-8087}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    networks: [infra]

volumes:
  milvus-data:
