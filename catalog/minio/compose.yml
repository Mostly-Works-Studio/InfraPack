# MinIO — S3-compatible object storage with its own web console. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  minio:
    image: quay.io/minio/minio:${MINIO_VERSION:-latest}
    container_name: infrapack-minio
    restart: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_UI_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [infra]

volumes:
  minio-data:
