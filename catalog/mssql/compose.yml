# Microsoft SQL Server 2022 (Developer edition). Managed by InfraPack.
# amd64 only: on Apple Silicon this runs under Rosetta/QEMU emulation.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}
    container_name: infrapack-mssql
    restart: *restart
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-InfraPack1!}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s
    networks: [infra]

volumes:
  mssql-data:
