# Memcached. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  memcached:
    image: memcached:${MEMCACHED_VERSION:-1-alpine}
    container_name: infrapack-memcached
    restart: *restart
    command: ["memcached", "-m", "${MEMCACHED_MEMORY_MB:-64}"]
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\\r\\nquit\\r\\n' | nc localhost 11211 | grep -q VERSION"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 3s
    networks: [infra]
