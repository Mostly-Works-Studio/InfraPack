# n8n — low-code workflow automation. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: infrapack-n8n
    restart: *restart
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-UTC}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [infra]

volumes:
  n8n-data:
