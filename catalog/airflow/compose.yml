# Apache Airflow standalone (SQLite, no login). Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  airflow:
    image: apache/airflow:${AIRFLOW_VERSION:-latest}
    container_name: infrapack-airflow
    restart: *restart
    command: ["standalone"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_PORT:-8093}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    ports:
      - "${AIRFLOW_PORT:-8093}:8080"
    volumes:
      - airflow-data:/opt/airflow
      - ${INFRAPACK_HOME}/stacks/airflow/files/dags:/opt/airflow/dags
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/version >/dev/null || curl -fs http://localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [infra]

volumes:
  airflow-data:
