# Prometheus + Grafana, wired together. Managed by InfraPack.
x-restart: &restart ${INFRA_RESTART:-no}

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    container_name: infrapack-prometheus
    restart: *restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ${INFRAPACK_HOME}/stacks/monitoring/files/prometheus:/etc/prometheus:ro
      - monitoring-prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready | grep -q Ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [infra]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: infrapack-grafana
    restart: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ${INFRAPACK_HOME}/stacks/monitoring/files/grafana/provisioning:/etc/grafana/provisioning:ro
      - monitoring-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [infra]

volumes:
  monitoring-prometheus-data:
  monitoring-grafana-data:
